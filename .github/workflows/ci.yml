name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            sanitizers: "ON"
          - build_type: Release
            sanitizers: "OFF"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DTINYCU_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
          -DTINYCU_BUILD_RUNTIME=OFF
      - name: Build
        run: cmake --build build
      - name: ctest
        run: ctest --test-dir build --output-on-failure
      - name: pytest
        env:
          TINYCU: ${{ github.workspace }}/build/tinycu
        run: |
          pip install -e harness
          pytest

  ptx-validate:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - uses: Jimver/cuda-toolkit@v0.2.19
        with:
          method: network
          sub-packages: '["nvcc", "cuobjdump", "nvdisasm"]'
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build tinycu
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTINYCU_BUILD_RUNTIME=OFF -DBUILD_TESTING=OFF
          cmake --build build
      - name: ptxas accepts every test program (-O0 and -O1)
        run: |
          ptxas --version
          tools/ptx_validate.sh build/tinycu sm_75
      - name: PTX / SASS statistics
        env:
          TINYCU: ${{ github.workspace }}/build/tinycu
        run: |
          pip install -e harness
          python -m tcharness.ptxstats >> "$GITHUB_STEP_SUMMARY"
