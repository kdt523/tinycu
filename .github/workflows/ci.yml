name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            sanitizers: "ON"
          - build_type: Release
            sanitizers: "OFF"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DTINYCU_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
          -DTINYCU_BUILD_RUNTIME=OFF
      - name: Build
        run: cmake --build build
      - name: ctest
        run: ctest --test-dir build --output-on-failure
      - name: pytest
        run: |
          pip install -e harness
          pytest

  ptx-validate:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - uses: Jimver/cuda-toolkit@v0.2.19
        with:
          method: network
          sub-packages: '["nvcc"]'
      - name: ptxas available
        run: ptxas --version
      # Phase 4 fills this in: compile every test program and run ptxas -arch=sm_75.
